name: Repository ruleset

on:
  pull_request:
    paths:
      - "rulesets/**"
      - "scripts/reconcile-ruleset.py"
      - ".github/workflows/apply-ruleset.yml"
  push:
    branches:
      - master
    paths:
      - "rulesets/**"
      - "scripts/reconcile-ruleset.py"
      - ".github/workflows/apply-ruleset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate desired ruleset
        run: python3 scripts/reconcile-ruleset.py --dry-run >/dev/null

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply desired ruleset
        env:
          RULESET_ADMIN_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN }}
        run: python3 scripts/reconcile-ruleset.py
