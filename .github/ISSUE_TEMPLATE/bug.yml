name: Bug report
description: Report a reproducible problem
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Search existing issues before submitting, and do not include secrets or sensitive information.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly and include the most relevant details.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps, commands, or example needed to reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions, operating system, runtime, browser, hardware, or deployment details.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, links, or other context that may help. Remove secrets and personal data first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
