name: Feature request
description: Suggest an improvement or new capability
title: ""
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem would this solve, or what would become easier?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or outcome you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share workarounds or alternative approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, links, screenshots, or other relevant information.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
